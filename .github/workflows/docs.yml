name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Check README
      run: |
        # Check that README.md exists and has content
        if [ ! -f README.md ]; then
          echo "README.md not found!"
          exit 1
        fi
        if [ $(wc -l < README.md) -lt 10 ]; then
          echo "README.md seems too short!"
          exit 1
        fi

    - name: Check docs directory
      run: |
        # Check that docs exist
        if [ ! -d docs ]; then
          echo "docs/ directory not found!"
          exit 1
        fi
        # Count markdown files
        doc_count=$(find docs -name "*.md" | wc -l)
        echo "Found $doc_count documentation files"
        if [ $doc_count -lt 3 ]; then
          echo "Not enough documentation files found!"
          exit 1
        fi

    - name: Check examples
      run: |
        # Check that examples exist
        if [ ! -d examples ]; then
          echo "examples/ directory not found!"
          exit 1
        fi
        # Count Python example files
        example_count=$(find examples -name "*.py" | wc -l)
        echo "Found $example_count example files"
        if [ $example_count -lt 5 ]; then
          echo "Not enough example files found!"
          exit 1
        fi

    - name: Validate Python examples
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Syntax check all examples
        for file in examples/*.py; do
          echo "Checking $file..."
          python -m py_compile "$file"
        done
