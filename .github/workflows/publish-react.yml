name: Publish React Package

on:
  push:
    paths:
      - 'craft-react/**'
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to publish to'
        required: true
        default: 'npm'
        type: choice
        options:
          - npm
          - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: craft-react/package-lock.json

    - name: Install dependencies
      working-directory: craft-react
      run: npm ci

    - name: Type check
      working-directory: craft-react
      run: npm run typecheck

    - name: Lint
      working-directory: craft-react
      run: npm run lint

    - name: Build
      working-directory: craft-react
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: craft-react/dist/

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'npm')

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: dist
        path: craft-react/dist/

    - name: Install dependencies
      working-directory: craft-react
      run: npm ci

    - name: Publish to npm
      working-directory: craft-react
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-test:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: dist
        path: craft-react/dist/

    - name: Install dependencies
      working-directory: craft-react
      run: npm ci

    - name: Publish to npm (dry run)
      working-directory: craft-react
      run: npm publish --dry-run
